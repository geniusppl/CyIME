name: CyIME Learn Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install NDK and tools
        run: |
          sdkmanager "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Configure (arm64 only, own package id, test signing key)
        run: |
          chmod +x gradlew
          # 只打 arm64，装成单独的 App（和官方 CyIME 可以并存）
          sed -i 's/abiFilters += listOf("armeabi-v7a", "arm64-v8a", "x86", "x86_64")/abiFilters += listOf("arm64-v8a")/' app/build.gradle.kts
          sed -i 's/applicationId = "com.cyletix.cyime"/applicationId = "com.cyletix.cyime.learn"/' app/build.gradle.kts
          # 日语 azooKey 预编译库上游没公开发布（下载 404），这个版本不带日语转换（不影响中文和英语）
          sed -i '/configureEach { dependsOn(prepareJapaneseDictionaries) }/d; /configureEach { dependsOn(prepareAzooKeyLibraries) }/d' app/build-logic/tasks-japanese.gradle.kts
          sed -i 's/, "prepareJapaneseDictionaries")/)/' app/build-logic/tasks-rime-manifest.gradle.kts
          grep -n dependsOn app/build-logic/tasks-rime-manifest.gradle.kts
          grep -n 'abiFilters\|applicationId =' app/build.gradle.kts
          # 测试版签名：固定一把测试密钥，保证每个测试版都能覆盖安装
          cat > app/keystore.properties <<PROPS
          storeFile=${GITHUB_WORKSPACE}/.github/signing/learn-test.p12
          storePassword=cyimelearn
          keyAlias=cyimelearn
          keyPassword=cyimelearn
          PROPS

      - name: Bundle Qingjian English glossary
        run: |
          # 青简英语释义表（GPL-3.0-or-later），固定到一个提交并核对 SHA-256，转成 CyIME 释义格式打进 APK
          url=https://raw.githubusercontent.com/qingjian-team/qingjian/869bdfa2aa18d04d871cb79e78ab2fe24b5d83be/assets/glossary/glossary-en.tsv
          for i in 1 2 3; do curl -fsSL --retry 3 -o /tmp/glossary-en.tsv "$url" && break; sleep 10; done
          echo "7b9676979aa227bde7a2d541354a59b73a04f33acd36ef5d6c433ce789b81625  /tmp/glossary-en.tsv" | sha256sum -c -
          mkdir -p app/src/main/assets/gloss
          python3 -I tools/dictionaries/glossary/convert_qingjian.py /tmp/glossary-en.tsv app/src/main/assets/gloss/qingjian_gloss_en.tsv

      - name: Download native deps (ONNX Runtime)
        run: ./gradlew downloadOnnx --no-daemon

      - name: Build release APK
        run: |
          # GitHub 下载偶尔 503/504，失败自动重试两次
          for i in 1 2 3 4; do
            ./gradlew assembleRelease --no-daemon && exit 0
            echo "retry $i"
            # 下载失败会留下空的 Boost 压缩包，删掉再试
            find . -name 'boost-*.tar.xz' -size -1M -print -delete || true
            rm -rf app/.cxx
            sleep 45
          done; exit 1

      - name: List outputs
        if: always()
        run: find app/build/outputs -name '*.apk' | head -20

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: CyIME-learn-arm64
          path: app/build/outputs/apk/release/*.apk

      - name: Compose release notes
        run: |
          {
            echo "## 本版更新"
            echo
            cat .github/release-notes/next.md
            echo
            cat .github/release-notes/footer.md
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Publish prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: learn-${{ github.run_number }}
          name: CyIME 学英语版 测试 ${{ github.run_number }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: app/build/outputs/apk/release/*.apk
          body_path: ${{ runner.temp }}/release-notes.md
